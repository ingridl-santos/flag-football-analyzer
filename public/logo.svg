  <line x1="16" y1="2" x2="16" y2="11" stroke="#7A5C00" stroke-width="2" stroke-linecap="round"/>

  <!-- Flag — triangle pointing right -->
  <path d="M16 2 L27 6 L16 10 Z" fill="#C9A227"/>

  <!-- Football body — pointed horizontal oval -->
  <path d="M3 19 C5 13 10 11 16 11 C22 11 27 13 29 19 C27 25 22 27 16 27 C10 27 5 25 3 19 Z" fill="#C9A227"/>

  <!-- Lace seam — vertical center line -->
  <line x1="16" y1="12" x2="16" y2="26" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lace crossbars -->
  <line x1="13" y1="16" x2="19" y2="16" stroke="#121212" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="19" x2="20" y2="19" stroke="#121212" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="22" x2="19" y2="22" stroke="#121212" stroke-width="1" stroke-linecap="round"/>
</svg>
